name=chipguy_P486Panel_480display
version=2.0.0
author=chipguyhere
maintainer=chipguyhere
sentence=ESP32-P4 DSI Display with 480x480 LVGL buffer and PPA scaling to 720x720
paragraph=Library for ESP32-P4 MIPI DSI displays. LVGL renders into a 480x480 draw buffer which is PPA-scaled to 720x720 DMA framebuffers for display output. Uses custom DPI panel driver with DMA chain manipulation for framebuffer switching. Includes the GT911 touch driver. Requires chipguy_P486Panel_board for the shared I2C bus the touch controller is on. The board (Waveshare ESP32-P4-86-Panel-ETH-2RO) has 32MB flash and 32MB PSRAM; both PSRAM and Flash Size=32MB must be selected in Tools.
category=Display
url=https://github.com/chipguyhere/P486Panel_480display
architectures=esp32
includes=chipguy_P486Panel_480display.h
depends=chipguy_P486Panel_board
